# O2 candidate: add mild sampling to the completed lower-LR O1 treatment.
# Relative to O1: only sampling_power changes from 0 (natural) to 0.25.
seed: 42
image_size: 512
input_mode: window16_cache
resize_mode: stretch
experiment:
  arm: lr1e5_sampling025
model:
  pretrained: true
  dropout: 0.1
  bottleneck: 256
loss:
  beta: 0.999
  gamma: 2.0
  ordinal: 0.5
  binary: 0.3
  neighbor: 0.2
training:
  batch_size: 2
  num_workers: 4
  valid_num_workers: 0
  sampling_power: 0.25
  epochs: 50
  min_epochs: 50
  patience: 10
  learning_rate: 0.00001
  weight_decay: 0.0001
  amp: true
wandb:
  enabled: true
  project: HCMUS-paper1
  entity: TN_Mammo_BreastDensity
  mode: online
