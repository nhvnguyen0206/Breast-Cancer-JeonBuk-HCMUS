# Pilot on the registered fold-0 FIT/DEV split; CAL/OUTER remain untouched.
seed: 42
image_size: 512
input_mode: window16_cache
model:
  pretrained: true
  dropout: 0.1
  bottleneck: 256
loss:
  beta: 0.999
  gamma: 2.0
  ordinal: 0.5
  binary: 0.3
  neighbor: 0.2
training:
  batch_size: 2
  num_workers: 2
  epochs: 5
  patience: 5
  learning_rate: 0.00005
  weight_decay: 0.0001
  amp: true
