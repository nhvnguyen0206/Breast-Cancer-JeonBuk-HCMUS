# A45: A44 plus training-only shared per-view auxiliary supervision.
seed: 42
image_size: 512
input_mode: window16_cache
resize_mode: stretch
experiment:
  arm: convnext_local_global_perviewaux_agate_dropout40_sampling025
augmentation:
  brightness_min: 0.9
  brightness_max: 1.1
  rotation_degrees: 5.0
  translation_fraction: 0.03
model:
  pretrained: true
  backbone: convnext_tiny
  dropout: 0.4
  bottleneck: 256
  fusion: local_global_view_attention
  primary_head: a_gate_hierarchical
  attention_dim: 256
  attention_heads: 8
  attention_layers: 2
  attention_dropout: 0.1
  spatial_grid_size: 4
  view_auxiliary: true
loss:
  beta: 0.999
  gamma: 2.0
  ordinal: 0.5
  binary: 0.3
  neighbor: 0.2
  view_auxiliary: 0.25
training:
  batch_size: 2
  num_workers: 4
  valid_num_workers: 0
  epochs: 50
  min_epochs: 50
  patience: 10
  learning_rate: 0.00005
  weight_decay: 0.0001
  sampling_power: 0.25
  amp: true
wandb:
  enabled: true
  project: HCMUS-paper1
  entity: TN_Mammo_BreastDensity
  mode: online
